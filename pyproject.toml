[project]
name = "geosplat"
version = "1.0.0"
description = "Turn a folder of images into a 3D Gaussian Splatting scene (COLMAP SfM + gsplat training)."
readme = "README.md"
authors = [
    { name = "MiguelUrenaPliego", email = "miguel.urena.pliego@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pillow",
    "tqdm",
    "pycolmap-cuda12>=4.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pycolmap>=3.11; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "gsplat==1.5.3",          # pinned: prebuilt Colab wheels (.github/workflows/gsplat-wheels.yml) match it
    "plyfile",
    "pyproj",
    "rasterio",
    "pyogrio",
    "shapely",
]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib", "ipyleaflet"]

[project.scripts]
geosplat = "geosplat.cli:main"

[dependency-groups]
dev = ["pytest", "ipykernel", "matplotlib", "ipyleaflet", "jupyterlab", "nbclient", "nbformat"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
